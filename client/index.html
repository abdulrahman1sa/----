  <!-- Botpress Custom Styles -->
  <style>
    #webchat {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 380px;
      height: 600px;
      z-index: 9999;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15), 0 10px 20px rgba(0, 0, 0, 0.1);
      display: none;
      /* Initially hidden */
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: bottom right;
      transform: scale(0.95);
      opacity: 0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }

    #webchat.active {
      display: block;
      transform: scale(1);
      opacity: 1;
    }

    @media (max-width: 600px) {
      #webchat {
        width: 90%;
        /* Responsive width */
        right: 5%;
        left: 5%;
        bottom: 20px;
        height: 75vh;
        border-radius: 16px;
      }
    }

    #webchat .bpWebchat {
      position: unset;
      width: 100%;
      height: 100%;
      max-height: 100%;
      max-width: 100%;
      background-color: rgba(255, 255, 255, 0.95);
      /* Slightly transparent bg */
    }

    #webchat .bpFab {
      display: none;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Botpress Container -->
  <div id="webchat"></div>

  <script type="module" src="/src/main.tsx"></script>

  <!-- Botpress Chatbot Script -->
  <script>
    function initBotpress() {
      if (!window.botpress) return;

      window.botpress.on("webchat:ready", () => {
        const webchatDiv = document.getElementById("webchat");
        if (webchatDiv) {
          webchatDiv.classList.add('active');
        }
        window.botpress.open();
      });

      window.botpress.init({
        "botId": "ed424138-b606-4130-af94-90b98578d742",
        "configuration": {
          "version": "v2",
          "botName": "مساعد بديع الذكي",
          "botDescription": "أنا هنا لمساعدتك في تحويل صورك إلى قصص 🚀",
          "website": {},
          "email": {},
          "phone": {},
          "termsOfService": {},
          "privacyPolicy": {},
          "color": "#7c3aed",
          "variant": "solid",
          "headerVariant": "glass",
          "themeMode": "light",
          "fontFamily": "Tajawal",
          "radius": 16,
          "feedbackEnabled": false,
          "footer": "مدعوم بالذكاء الاصطناعي ⚡",
          "soundEnabled": true,
          "proactiveMessageEnabled": true,
          "proactiveBubbleMessage": "مرحباً! كيف يمكنني مساعدتك اليوم؟ 👋",
          "proactiveBubbleTriggerType": "afterDelay",
          "proactiveBubbleDelayTime": 5
        },
        "clientId": "1cee07fe-2958-479e-9245-fb3976b14205",
        "selector": "#webchat"
      });
    }
  </script>
  <script src="https://cdn.botpress.cloud/webchat/v3.3/inject.js" onload="initBotpress()"></script>
</body>
